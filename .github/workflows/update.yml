name: Update profile card

on:
  schedule:
    - cron: "17 3 * * *"   # daily, ~4:17am Lagos time
  workflow_dispatch:        # run it manually from the Actions tab
  push:
    branches: [main]
    paths: [generate.py, face.txt]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build SVGs
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN || github.token }}
        run: python generate.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          git diff --staged --quiet || git commit -m "chore: update profile card"
          git push
